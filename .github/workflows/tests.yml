name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 6 of the unit tests actually hit a real Redis instance (job store cache persistence checks), so we spin one up as a service container
    # instead of mocking it - closer to how the app really behaves.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers pulls in torch and isn't needed for the
          # unit test suite - skipping it keeps CI fast.
          grep -v "sentence-transformers" requirements.txt > requirements_ci.txt
          pip install -r requirements_ci.txt

      - name: Run tests
        run: pytest tests/ -v
